name: 执行EasyX界面重构
on:
  push:
    branches:
      - easyx-refactor-clean
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出干净临时分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 提取重构脚本
        shell: bash
        run: |
          git fetch origin '文字清晰度修复临时分支'
          git show 'origin/文字清晰度修复临时分支:.github/workflows/重构EasyX界面.yml' > /tmp/source_workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          workflow = Path('/tmp/source_workflow.yml').read_text(encoding='utf-8')
          line = next((item.strip() for item in workflow.splitlines() if item.strip().startswith("echo 'ZnJv")), None)
          if line is None:
              raise RuntimeError('找不到EasyX重构脚本数据')
          payload = line.split("echo '", 1)[1].rsplit("' | base64", 1)[0]
          match = re.match(r'[A-Za-z0-9+/=]+', payload)
          if not match:
              raise RuntimeError('重构脚本base64前缀不存在')
          prefix = match.group(0)
          padded_prefix = prefix + '=' * ((4 - len(prefix) % 4) % 4)
          decoded_prefix = base64.b64decode(padded_prefix).decode('utf-8', errors='ignore')
          raw_suffix = payload[len(prefix):]
          script = decoded_prefix + raw_suffix

          needle = 'text = path.read_bytes().decode("gb2312")\n'
          if needle not in script:
              raise RuntimeError('找不到源码读取语句')
          script = script.replace(needle, needle + 'text = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")\n', 1)

          marker_pattern = r'ui_start_marker\s*=.*?ui_end\s*=\s*text\.index\(ui_end_marker\)\n'
          marker_replacement = '''ui_function_position = text.index("bool enable_high_dpi_rendering()")
ui_start = text.rfind("/***************************************************************************", 0, ui_function_position)
ui_end_function_position = text.index("void invalidate_route_result")
ui_end = text.rfind("/***************************************************************************", 0, ui_end_function_position)
'''
          script, count = re.subn(marker_pattern, marker_replacement, script, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('替换EasyX区域定位逻辑失败')

          input_pattern = r'input_start_marker\s*=.*?input_start\s*=\s*text\.index\(input_start_marker\)\n'
          input_replacement = '''input_function_position = text.index("void handle_left_click(")
input_start = text.rfind("/***************************************************************************", 0, input_function_position)
'''
          script, count = re.subn(input_pattern, input_replacement, script, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('替换输入区域定位逻辑失败')

          Path('/tmp/refactor.py').write_text(script, encoding='utf-8')
          compile(script, '/tmp/refactor.py', 'exec')
          print('重构脚本恢复完成，字节数：', len(script.encode('utf-8')))
          PY
      - name: 重构并检查源码
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/refactor.py

          mkdir -p /tmp/stub
          cat > /tmp/stub/windows.h <<'EOF'
          #pragma once
          #include <cstddef>
          #include <cstdint>
          typedef int BOOL;
          typedef void* HANDLE;
          typedef void* HMODULE;
          typedef void* HWND;
          typedef long long LONG_PTR;
          typedef long long INT_PTR;
          typedef unsigned char BYTE;
          #define WINAPI
          #define FALSE 0
          #define TRUE 1
          #define FW_NORMAL 400
          #define FW_BOLD 700
          #define GB2312_CHARSET 134
          #define OUT_TT_PRECIS 4
          #define CLIP_DEFAULT_PRECIS 0
          #define CLEARTYPE_NATURAL_QUALITY 6
          #define CLEARTYPE_QUALITY 5
          #define DEFAULT_PITCH 0
          #define FF_SWISS 32
          #define FF_MODERN 48
          #define LF_FACESIZE 32
          #define GWL_STYLE -16
          #define WS_THICKFRAME 0x00040000L
          #define WS_MAXIMIZEBOX 0x00010000L
          #define SWP_NOSIZE 0x0001
          #define SWP_NOZORDER 0x0004
          #define SWP_NOACTIVATE 0x0010
          #define SWP_FRAMECHANGED 0x0020
          struct LOGFONT {
              long lfHeight; long lfWidth; long lfEscapement; long lfOrientation; long lfWeight;
              BYTE lfItalic; BYTE lfUnderline; BYTE lfStrikeOut; BYTE lfCharSet;
              BYTE lfOutPrecision; BYTE lfClipPrecision; BYTE lfQuality; BYTE lfPitchAndFamily;
              char lfFaceName[LF_FACESIZE];
          };
          inline HMODULE GetModuleHandleA(const char*) { return nullptr; }
          inline void* GetProcAddress(HMODULE, const char*) { return nullptr; }
          inline BOOL SetProcessDPIAware() { return TRUE; }
          inline LONG_PTR GetWindowLongPtr(HWND, int) { return 0; }
          inline LONG_PTR SetWindowLongPtr(HWND, int, LONG_PTR) { return 0; }
          inline BOOL SetWindowPos(HWND, HWND, int, int, int, int, unsigned int) { return TRUE; }
          EOF

          cat > /tmp/stub/graphics.h <<'EOF'
          #pragma once
          #include "windows.h"
          #define EX_SHOWCONSOLE 1
          #define EX_MOUSE 2
          #define EX_KEY 4
          #define EX_WINDOW 8
          #define PS_SOLID 0
          #define PS_DASH 1
          #define TRANSPARENT 1
          #define WM_CLOSE 0x0010
          #define WM_KEYDOWN 0x0100
          #define WM_MOUSEMOVE 0x0200
          #define WM_LBUTTONDOWN 0x0201
          #define VK_ESCAPE 0x1B
          struct IMAGE {};
          struct ExMessage { unsigned int message; int x; int y; unsigned short vkcode; };
          inline unsigned long RGB(int, int, int) { return 0; }
          inline void initgraph(int, int, int) {}
          inline void closegraph() {}
          inline HWND GetHWnd() { return nullptr; }
          inline void setbkcolor(unsigned long) {}
          inline void cleardevice() {}
          inline void setlinecolor(unsigned long) {}
          inline void setlinestyle(int, int = 1) {}
          inline void line(int, int, int, int) {}
          inline void setfillcolor(unsigned long) {}
          inline void fillcircle(int, int, int) {}
          inline void solidcircle(int, int, int) {}
          inline void solidrectangle(int, int, int, int) {}
          inline void rectangle(int, int, int, int) {}
          inline void putimage(int, int, const IMAGE*) {}
          inline void loadimage(IMAGE*, const char*) {}
          inline void setbkmode(int) {}
          inline void settextcolor(unsigned long) {}
          inline void settextstyle(const LOGFONT*) {}
          inline int textwidth(const char*) { return 80; }
          inline int textheight(const char*) { return 15; }
          inline void outtextxy(int, int, const char*) {}
          inline void BeginBatchDraw() {}
          inline void EndBatchDraw() {}
          inline void FlushBatchDraw() {}
          inline ExMessage getmessage(int) { return ExMessage{}; }
          EOF

          g++ -std=c++17 -fsyntax-only -finput-charset=GB2312 -fexec-charset=GB2312 -I/tmp/stub main.cpp
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('main.cpp').read_bytes()
          raw.decode('gb2312')
          if b'\n' in raw.replace(b'\r\n', b''):
              raise RuntimeError('main.cpp存在非CRLF换行')
          print('C++17静态语法检查通过')
          print('GB2312 + CRLF字节检查通过')
          PY
      - name: 提交到main
        shell: bash
        run: |
          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add main.cpp
          git diff --cached --stat
          git commit -m "重构EasyX界面并优化录屏布局"
          git push origin HEAD:main
