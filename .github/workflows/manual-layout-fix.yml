name: manual-layout-fix

on:
  push:
    branches:
      - manual-layout-fix-20260905
    paths:
      - .github/workflows/manual-layout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual-layout-fix-20260905
          fetch-depth: 0

      - name: 调整总览站点和站名位置
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.cpp')
          text = path.read_bytes().decode('gb2312')
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          coordinate_marker = '    screen_point point;\n    point.x = scale_total_map_x(logical_x);'
          coordinate_insert = '''    // 嘉定公交密集区使用人工示意坐标，避免公交节点落在11号线深棕色主线上
              switch (physical_vertex) {
                  case 64: logical_x = 110; logical_y = 300; break; // 昌吉东路站
                  case 65: logical_x = 90;  logical_y = 318; break; // 双浦路
                  case 66: logical_x = 75;  logical_y = 338; break; // 于塘南路
                  case 67: logical_x = 115; logical_y = 330; break; // 望融路
                  case 68: logical_x = 135; logical_y = 305; break; // 安虹北路
                  case 69: logical_x = 155; logical_y = 290; break; // 绿苑路
                  case 70: logical_x = 55;  logical_y = 355; break; // 安谐路
                  case 71: logical_x = 72;  logical_y = 370; break; // 于田路
                  case 72: logical_x = 95;  logical_y = 372; break; // 安虹路
                  case 73: logical_x = 125; logical_y = 375; break; // 二十三号桥
                  case 84: logical_x = 140; logical_y = 395; break; // 嘉松北路
                  case 83: logical_x = 160; logical_y = 400; break; // 新黄公路
                  case 82: logical_x = 180; logical_y = 405; break; // 许家东街村
                  case 81: logical_x = 205; logical_y = 410; break; // 星塔路
                  case 80: logical_x = 230; logical_y = 415; break; // 联群路
                  case 79: logical_x = 255; logical_y = 420; break; // 联西路
                  case 78: logical_x = 280; logical_y = 425; break; // 宝园七路
                  case 77: logical_x = 305; logical_y = 430; break; // 宝园五路
                  case 76: logical_x = 335; logical_y = 435; break; // 曹丰路
                  case 75: logical_x = 365; logical_y = 440; break; // 翔江路
                  case 74: logical_x = 400; logical_y = 445; break; // 封浜公交站
                  default: break;
              }

          '''
          if coordinate_marker not in text:
              raise SystemExit('未找到总览坐标输出位置')
          text = text.replace(coordinate_marker,
              coordinate_insert + coordinate_marker, 1)

          helper = r'''/***************************************************************************
            函数名称：get_manual_station_label_rectangle
            功    能：为当前总览图中需要精确排版的站点指定固定站名位置
            输入参数：站点编号、站点屏幕坐标、标签尺寸、输出矩形
            返 回 值：存在人工位置返回true，否则返回false
            说    明：只处理当前固定示意图，不改变算法站名和CSV数据
          ***************************************************************************/
          bool get_manual_station_label_rectangle(int vertex_id,
              const screen_point& point, const station_label_text& label,
              station_label_rectangle& rectangle)
          {
              int dx = 0;
              int dy = 0;

              switch (vertex_id) {
                  case 28: dx = -42; dy = -34; break; // 上海赛车场
                  case 27: dx = -42; dy = -34; break; // 嘉定新城
                  case 26: dx = 14;  dy = -24; break; // 马陆
                  case 25: dx = 14;  dy = -24; break; // 陈翔公路
                  case 24: dx = 14;  dy = -24; break; // 南翔
                  case 29: dx = -92; dy = -14; break; // 昌吉东路
                  case 30: dx = 12;  dy = 14;  break; // 上海汽车城

                  case 64: dx = 14;  dy = -28; break; // 昌吉东路站
                  case 65: dx = -62; dy = 12;  break; // 双浦路
                  case 66: dx = -78; dy = 12;  break; // 于塘南路
                  case 67: dx = -18; dy = -30; break; // 望融路
                  case 68: dx = 14;  dy = -28; break; // 安虹北路
                  case 69: dx = 14;  dy = 8;   break; // 绿苑路
                  case 70: dx = -62; dy = 12;  break; // 安谐路
                  case 71: dx = -62; dy = 12;  break; // 于田路
                  case 72: dx = -62; dy = 12;  break; // 安虹路
                  case 73: dx = -20; dy = 14;  break; // 二十三号桥

                  case 84: dx = -38; dy = -30; break; // 嘉松北路
                  case 83: dx = -38; dy = 14;  break; // 新黄公路
                  case 82: dx = -55; dy = -30; break; // 许家东街村
                  case 81: dx = -28; dy = 14;  break; // 星塔路
                  case 80: dx = -28; dy = -30; break; // 联群路
                  case 79: dx = -28; dy = 14;  break; // 联西路
                  case 78: dx = -38; dy = -30; break; // 宝园七路
                  case 77: dx = -38; dy = 14;  break; // 宝园五路
                  case 76: dx = -28; dy = -30; break; // 曹丰路
                  case 75: dx = -28; dy = 14;  break; // 翔江路
                  case 74: dx = 14;  dy = 14;  break; // 封浜公交站
                  default: return false;
              }

              rectangle.left = point.x + dx;
              rectangle.top = point.y + dy;
              rectangle.right = rectangle.left + label.width;
              rectangle.bottom = rectangle.top + label.height;
              return true;
          }

          '''

          draw_pos = text.index('void draw_all_station_names(')
          comment_pos = text.rfind('/***************************************************************************', 0, draw_pos)
          if comment_pos < 0:
              raise SystemExit('未找到draw_all_station_names注释块')
          text = text[:comment_pos] + helper + text[comment_pos:]

          draw_pos = text.index('void draw_all_station_names(')
          choose_start = text.index(
              '        station_label_rectangle chosen = choose_station_label_rectangle(',
              draw_pos)
          choose_end_marker = '        draw_station_label(chosen, label);'
          choose_end = text.index(choose_end_marker, choose_start) + len(choose_end_marker)
          new_choose = '''        station_label_rectangle chosen;
              if (!get_manual_station_label_rectangle(
                  vertex_id, point, label, chosen)) {
                  chosen = choose_station_label_rectangle(
                      point.x, point.y, label.width, label.height,
                      placed_rectangles, placed_number,
                      vertices, vertex_number, vertex_id);
              }

              draw_station_label(chosen, label);'''
          text = text[:choose_start] + new_choose + text[choose_end:]

          campus_start = text.index(
              '    station_label_rectangle campus_rectangle = choose_station_label_rectangle(',
              draw_pos)
          campus_end_marker = '    draw_station_label(campus_rectangle, campus_label);'
          campus_end = text.index(campus_end_marker, campus_start) + len(campus_end_marker)
          new_campus = '''    station_label_rectangle campus_rectangle;
              campus_rectangle.left = campus_point.x - campus_label.width / 2;
              campus_rectangle.top = campus_point.y - campus_label.height - 22;
              campus_rectangle.right = campus_rectangle.left + campus_label.width;
              campus_rectangle.bottom = campus_rectangle.top + campus_label.height;
              draw_station_label(campus_rectangle, campus_label);'''
          text = text[:campus_start] + new_campus + text[campus_end:]

          if 'bool get_manual_station_label_rectangle(int vertex_id,' not in text:
              raise SystemExit('人工站名函数未插入')
          if 'case 64: logical_x = 110; logical_y = 300;' not in text:
              raise SystemExit('人工站点坐标未插入')
          if text.count('{') != text.count('}'):
              raise SystemExit('花括号数量不平衡')

          path.write_bytes(text.replace('\n', '\r\n').encode('gb2312'))
          check = path.read_bytes()
          check.decode('gb2312')
          if b'\n' in check.replace(b'\r\n', b''):
              raise SystemExit('存在非CRLF换行')
          print('人工站点布局完成，GB2312 + CRLF检查通过')

      - name: 提交修改
        run: |
          rm .github/workflows/manual-layout-fix.yml
          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add main.cpp .github/workflows/manual-layout-fix.yml
          git commit -m "优化站点布局"
          git push origin HEAD:manual-layout-fix-20260905
