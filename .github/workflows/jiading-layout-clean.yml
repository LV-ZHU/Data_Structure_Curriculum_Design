name: jiading-layout-clean

on:
  push:
    branches:
      - layout-fix-822-20260905
    paths:
      - .github/workflows/jiading-layout-clean.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout-fix-822-20260905
          fetch-depth: 0

      - name: 重排嘉定站点
        shell: python
        run: |
          from pathlib import Path
          path = Path('main.cpp')
          raw = path.read_bytes()
          encoding = None
          for candidate in ('utf-8', 'gb2312'):
              try:
                  text = raw.decode(candidate)
                  encoding = candidate
                  break
              except UnicodeDecodeError:
                  pass
          if encoding is None:
              raise SystemExit('无法识别main.cpp字符集')
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          coord_start = text.index('    // 822路沿“封浜公交站 -> 嘉定校区正门”直线方向排布，封浜公交站紧贴封浜地铁站\n')
          coord_end = text.index('    screen_point point;\n', coord_start)
          new_coords = '''    // 嘉定公交总览采用人工示意坐标：两条校区接驳线分开排布，822沿封浜至嘉定校区方向展开\n    switch (physical_vertex) {\n        // 嘉定西侧两条公交走廊：保持与昌吉东路、上海汽车城的换乘关系，同时避免节点堆叠\n        case 64: logical_x = 105; logical_y = 130; break; // 昌吉东路站\n        case 65: logical_x = 80;  logical_y = 145; break; // 双浦路\n        case 66: logical_x = 58;  logical_y = 162; break; // 于塘南路\n        case 67: logical_x = 52;  logical_y = 185; break; // 望融路\n        case 68: logical_x = 78;  logical_y = 207; break; // 安虹北路\n        case 69: logical_x = 115; logical_y = 220; break; // 绿苑路\n\n        case 70: logical_x = 72;  logical_y = 158; break; // 安谐路\n        case 71: logical_x = 92;  logical_y = 180; break; // 于田路\n        case 72: logical_x = 112; logical_y = 200; break; // 安虹路\n        case 73: logical_x = 132; logical_y = 218; break; // 二十三号桥\n\n        // 822路：封浜公交站几乎贴住封浜地铁站，再沿直线向嘉定校区收束\n        case 74: logical_x = 317; logical_y = 357; break; // 封浜公交站\n        case 75: logical_x = 303; logical_y = 347; break; // 翔江路\n        case 76: logical_x = 289; logical_y = 337; break; // 曹丰路\n        case 77: logical_x = 275; logical_y = 327; break; // 宝园五路\n        case 78: logical_x = 261; logical_y = 317; break; // 宝园七路\n        case 79: logical_x = 247; logical_y = 307; break; // 联西路\n        case 80: logical_x = 233; logical_y = 297; break; // 联群路\n        case 81: logical_x = 219; logical_y = 287; break; // 星塔路\n        case 82: logical_x = 205; logical_y = 277; break; // 许家东街村\n        case 83: logical_x = 191; logical_y = 267; break; // 新黄公路\n        case 84: logical_x = 177; logical_y = 257; break; // 嘉松北路\n        default: break;\n    }\n\n'''
          text = text[:coord_start] + new_coords + text[coord_end:]

          fn_start = text.index('bool get_manual_station_label_rectangle(int vertex_id,')
          switch_start = text.index('    switch (vertex_id) {', fn_start)
          switch_end = text.index('    rectangle.left = point.x + dx;', switch_start)
          old_switch = text[switch_start:switch_end]
          # 密集嘉定公交站64-73不再强行固定文字坐标，让现有碰撞/避线算法自行排版
          for vertex_id in range(64, 74):
              lines = old_switch.splitlines(True)
              lines = [line for line in lines if f'case {vertex_id}:' not in line]
              old_switch = ''.join(lines)
          text = text[:switch_start] + old_switch + text[switch_end:]

          if 'case 64: logical_x = 105; logical_y = 130;' not in text:
              raise SystemExit('嘉定公交走廊坐标未写入')
          if 'case 74: logical_x = 317; logical_y = 357;' not in text:
              raise SystemExit('封浜公交站未贴近封浜地铁站')
          manual_section = text[fn_start:text.index('    rectangle.left = point.x + dx;', fn_start)]
          for vertex_id in range(64, 74):
              if f'case {vertex_id}:' in manual_section:
                  raise SystemExit(f'{vertex_id}号站仍被强制手工标签定位')
          if text.count('{') != text.count('}'):
              raise SystemExit('花括号数量不平衡')

          out = text.replace('\n', '\r\n').encode(encoding)
          path.write_bytes(out)
          check = path.read_bytes()
          check.decode(encoding)
          if b'\n' in check.replace(b'\r\n', b''):
              raise SystemExit('存在非CRLF换行')
          print('布局修正完成；字符集保持', encoding, '；CRLF检查通过')

      - name: 提交修改
        run: |
          rm .github/workflows/jiading-layout-clean.yml
          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "优化嘉定站点布局"
          git push origin HEAD:layout-fix-822-20260905
