name: 线路图布局优化
on:
  push:
    branches:
      - 文字清晰度修复临时分支
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 重排线路图
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add main.cpp data/stations.csv
          git diff --cached --stat
          git commit -m "优化线路图布局"
          git push origin HEAD:main
