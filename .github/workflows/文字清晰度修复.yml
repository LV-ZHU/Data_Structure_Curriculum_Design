name: 线路图布局优化

on:
  push:
    branches:
      - 文字清晰度修复临时分支

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 重排线路图并调整长距离线路绘制
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import io

          # 一、重排总览图坐标。这里只改变EasyX显示坐标，不改变图结构、耗时、票价和Dijkstra。
          station_path = Path('data/stations.csv')
          station_text = station_path.read_bytes().decode('gb2312')
          station_text = station_text.replace('\r\n', '\n').replace('\r', '\n')
          rows = list(csv.DictReader(io.StringIO(station_text)))

          new_coordinates = {
              0:(710,550), 1:(745,550), 2:(780,550), 3:(815,550), 4:(840,550),
              5:(840,520), 6:(840,480), 7:(840,440), 8:(840,400), 9:(840,360),
              10:(840,320), 11:(865,280), 12:(885,240),
              13:(710,550), 14:(680,520), 15:(650,490), 16:(620,460), 17:(590,460),
              18:(560,430), 19:(520,390), 20:(480,350), 21:(440,310), 22:(400,270),
              23:(360,230), 24:(320,190), 25:(280,150), 26:(240,110), 27:(200,70),
              28:(140,70), 29:(100,110), 30:(60,150),
              31:(840,520), 32:(790,520), 33:(740,520), 34:(710,490), 35:(680,460),
              36:(650,460), 37:(620,460), 38:(590,430), 39:(560,430), 40:(530,400),
              41:(500,360), 42:(470,360), 43:(440,360), 44:(410,360), 45:(380,360),
              46:(350,360), 47:(320,360),
              48:(780,550), 49:(740,520), 50:(740,480), 51:(740,440), 52:(740,400),
              53:(740,360), 54:(740,320),
              55:(685,600),
              56:(135,240), 57:(150,255), 58:(170,235), 59:(155,250), 60:(150,220),
              61:(165,240), 62:(145,215), 63:(120,180),
              64:(105,125), 65:(75,140), 66:(45,160), 67:(45,190), 68:(75,205),
              69:(115,205),
              70:(75,150), 71:(95,175), 72:(115,200), 73:(135,225),
              74:(325,375), 75:(300,375), 76:(275,375), 77:(250,375), 78:(225,375),
              79:(200,375), 80:(175,375), 81:(150,375), 82:(140,345), 83:(140,315),
              84:(145,285),
              85:(570,440), 86:(600,450), 87:(635,480), 88:(870,270),
              89:(500,350), 90:(760,300), 91:(865,250)
          }

          physical_name_to_coordinate = {}
          for row in rows:
              vertex_id = int(row['id'])
              if vertex_id < 92:
                  x, y = new_coordinates[vertex_id]
                  row['x'] = str(x)
                  row['y'] = str(y)
                  physical_name_to_coordinate.setdefault(row['name'], (x, y))

          # 公交虚拟节点继续与对应物理节点保持同名同坐标，保证原有映射逻辑不变。
          for row in rows:
              vertex_id = int(row['id'])
              if vertex_id >= 92:
                  if row['name'] not in physical_name_to_coordinate:
                      raise RuntimeError('找不到虚拟节点对应物理节点：' + row['name'])
                  x, y = physical_name_to_coordinate[row['name']]
                  row['x'] = str(x)
                  row['y'] = str(y)

          output = io.StringIO()
          writer = csv.DictWriter(output,
              fieldnames=['id','name','type','x','y'],
              lineterminator='\n')
          writer.writeheader()
          writer.writerows(rows)
          station_bytes = output.getvalue().replace('\n', '\r\n').encode('gb2312')
          station_path.write_bytes(station_bytes)

          # 二、总览图长距离公交不再用一根直线切穿整个网络，改用示意图式折线。
          main_path = Path('main.cpp')
          text = main_path.read_bytes().decode('gb2312')
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          def replace_function(signature, new_code):
              global text
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError('找不到函数：' + signature)
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError('找不到函数左花括号：' + signature)
              depth = 0
              end = -1
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  raise RuntimeError('找不到函数右花括号：' + signature)
              text = text[:start] + new_code.rstrip() + text[end:]

          draw_all_marker = '/***************************************************************************\n  函数名称：draw_all_edges'
          if draw_all_marker not in text:
              raise RuntimeError('找不到draw_all_edges注释标记')

          helper_code = r'''/***************************************************************************
  函数名称：draw_schematic_connection
  功    能：按轨道交通示意图方式绘制总览图中的一条连接
  输入参数：const vertex vertices[]：顶点数组；int from_vertex：起点编号；
  int to_vertex：终点编号；const edge_node* current_edge：当前边
  返 回 值：无
  说    明：普通边直接连接；两条教师班车沿总图外缘绕行，避免长直线切穿网络中心
***************************************************************************/
void draw_schematic_connection(const vertex vertices[],
    int from_vertex, int to_vertex,
    const edge_node* current_edge)
{
    int x1 = vertices[from_vertex].x;
    int y1 = vertices[from_vertex].y;
    int x2 = vertices[to_vertex].x;
    int y2 = vertices[to_vertex].y;

    if (!current_edge) {
        line(x1, y1, x2, y2);
        return;
    }

    int dx = x1 - x2;
    int dy = y1 - y2;
    int distance_square = dx * dx + dy * dy;

    if (current_edge->type == edge_type::BUS
        && current_edge->line_id == 10
        && distance_square > 10000) {
        const int route_y = 675;
        line(x1, y1, x1, route_y);
        line(x1, route_y, x2, route_y);
        line(x2, route_y, x2, y2);
        return;
    }

    if (current_edge->type == edge_type::BUS
        && current_edge->line_id == 11
        && distance_square > 10000) {
        int left_x = x1;
        int left_y = y1;
        int right_x = x2;
        int right_y = y2;

        if (left_x > right_x) {
            left_x = x2;
            left_y = y2;
            right_x = x1;
            right_y = y1;
        }

        const int border_x = 24;
        const int border_y = 22;
        line(left_x, left_y, border_x, left_y);
        line(border_x, left_y, border_x, border_y);
        line(border_x, border_y, right_x, border_y);
        line(right_x, border_y, right_x, right_y);
        return;
    }

    line(x1, y1, x2, y2);
}

'''
          text = text.replace(draw_all_marker,
              helper_code + draw_all_marker, 1)

          replace_function(
              'void draw_all_edges(const vertex vertices[], int vertex_number)',
              r'''void draw_all_edges(const vertex vertices[], int vertex_number)
{
    for (int i = 0; i < vertex_number; i++) {
        const edge_node* current_edge = vertices[i].first_edge;
        while (current_edge) {
            if (i < current_edge->to) {
                if (current_edge->type == edge_type::TRANSFER) {
                    setlinecolor(RGB(160, 168, 176));
                    setlinestyle(PS_DASH, 1);
                }
                else if (current_edge->type == edge_type::BUS) {
                    if (current_edge->line_id == 10
                        || current_edge->line_id == 11) {
                        setlinecolor(RGB(47, 124, 89));
                        setlinestyle(PS_DASH, 1);
                    }
                    else {
                        setlinecolor(RGB(33, 118, 163));
                        setlinestyle(PS_SOLID, 2);
                    }
                }
                else {
                    switch (current_edge->line_id) {
                        case 0:
                            setlinecolor(RGB(111, 75, 126));
                            break;
                        case 1:
                            setlinecolor(RGB(124, 74, 43));
                            break;
                        case 2:
                            setlinecolor(RGB(123, 115, 15));
                            break;
                        case 3:
                            setlinecolor(RGB(177, 36, 50));
                            break;
                        default:
                            setlinecolor(RGB(70, 100, 150));
                            break;
                    }
                    setlinestyle(PS_SOLID, 4);
                }

                draw_schematic_connection(vertices,
                    i, current_edge->to, current_edge);
            }
            current_edge = current_edge->next;
        }
    }
    setlinestyle(PS_SOLID, 1);
}''')

          replace_function(
              'void draw_route_highlight(const vertex vertices[], const ui_state& state)',
              r'''void draw_route_highlight(const vertex vertices[], const ui_state& state)
{
    if (!state.route_ready || state.path_vertex_number < 2)
        return;

    setlinecolor(RGB(255, 210, 40));
    setlinestyle(PS_SOLID, 7);

    for (int i = state.path_vertex_number - 1; i > 0; i--) {
        int from_vertex = state.path[i];
        int to_vertex = state.path[i - 1];
        bool from_is_virtual = from_vertex >= physical_vertex_number;
        bool to_is_virtual = to_vertex >= physical_vertex_number;

        if (from_is_virtual != to_is_virtual)
            continue;

        const edge_node* route_edge = state.previous_edge[to_vertex];
        draw_schematic_connection(vertices,
            from_vertex, to_vertex, route_edge);
    }

    setlinestyle(PS_SOLID, 1);
}''')

          main_bytes = text.replace('\n', '\r\n').encode('gb2312')
          main_path.write_bytes(main_bytes)

          # 三、字符集与换行最终自检。
          for checked_path in [station_path, main_path]:
              checked = checked_path.read_bytes()
              checked.decode('gb2312')
              if b'\n' in checked.replace(b'\r\n', b''):
                  raise RuntimeError(str(checked_path) + '存在非CRLF换行')

          print('线路图布局已重排')
          print('stations.csv：GB2312 + CRLF')
          print('main.cpp：GB2312 + CRLF')
          PY

          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add main.cpp data/stations.csv
          git diff --cached --stat
          git commit -m "优化线路图布局"
          git push origin HEAD:main
