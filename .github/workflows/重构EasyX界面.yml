text = text[:input_start] + '\n/***************************************************************************\n  函数名称：handle_left_click\n  功    能：处理新版EasyX界面的鼠标左键点击\n  输入参数：鼠标坐标、顶点数组、嘉定局部节点和ui_state\n  返 回 值：无\n  说    明：全部控件坐标统一引用ui_layout；点击总览嘉定校园枢纽会直接进入局部图\n***************************************************************************/\nvoid handle_left_click(int mouse_x, int mouse_y,\n    vertex vertices[], int vertex_number,\n    const jiading_map_node map_nodes[],\n    int map_node_number,\n    ui_state& state)\n{\n    if (mouse_x < ui_layout::map_width) {\n        int clicked_vertex = -1;\n\n        if (state.is_jiading_campus)\n            clicked_vertex =\n                find_clicked_jiading_vertex(\n                    map_nodes, map_node_number,\n                    mouse_x, mouse_y);\n        else\n            clicked_vertex =\n                find_clicked_vertex(\n                    vertices, vertex_number,\n                    mouse_x, mouse_y);\n\n        if (clicked_vertex == -2) {\n            state.is_jiading_campus = true;\n            state.hovered_vertex = -1;\n            state.message = "请在嘉定校区局部图选择具体站点";\n            return;\n        }\n\n        if (clicked_vertex == -1)\n            return;\n\n        if (state.start_vertex == -1) {\n            state.start_vertex = clicked_vertex;\n            state.end_vertex = -1;\n            invalidate_route_result(state);\n            state.message = "请选择终点";\n        }\n        else {\n            if (clicked_vertex == state.start_vertex) {\n                state.message = "终点不能与起点相同";\n                return;\n            }\n\n            state.end_vertex = clicked_vertex;\n            invalidate_route_result(state);\n            state.message = "起终点已选择，请开始规划";\n        }\n\n        return;\n    }\n\n    const int left = ui_layout::panel_content_left;\n    const int right = ui_layout::panel_content_right;\n\n    if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        left, 128, right, 158)) {\n        state.is_jiading_campus =\n            !state.is_jiading_campus;\n        state.hovered_vertex = -1;\n        return;\n    }\n\n    if (state.route_ready\n        && state.segment_number > 0) {\n        const int segments_per_page = 4;\n        int total_pages =\n            (state.segment_number + segments_per_page - 1)\n            / segments_per_page;\n\n        if (is_point_in_rectangle(\n            mouse_x, mouse_y,\n            left, 764, left + 42, 790)) {\n            if (state.guide_page > 0)\n                state.guide_page--;\n            return;\n        }\n\n        if (is_point_in_rectangle(\n            mouse_x, mouse_y,\n            right - 42, 764, right, 790)) {\n            if (state.guide_page + 1 < total_pages)\n                state.guide_page++;\n            return;\n        }\n    }\n\n    if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        left, 214, left + 64, 252)) {\n        int total_minutes =\n            state.start_hour * 60 + state.start_minute;\n\n        total_minutes -= 5;\n        if (total_minutes < 0)\n            total_minutes += 24 * 60;\n\n        state.start_hour = total_minutes / 60;\n        state.start_minute = total_minutes % 60;\n        invalidate_route_result(state);\n        state.message = "出发时间已修改，请重新规划";\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        right - 64, 214, right, 252)) {\n        int total_minutes =\n            state.start_hour * 60 + state.start_minute;\n\n        total_minutes =\n            (total_minutes + 5) % (24 * 60);\n\n        state.start_hour = total_minutes / 60;\n        state.start_minute = total_minutes % 60;\n        invalidate_route_result(state);\n        state.message = "出发时间已修改，请重新规划";\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        left, 312, left + 158, 352)) {\n        state.k = 0;\n        invalidate_route_result(state);\n        state.message = "已选择时间最短策略";\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        right - 158, 312, right, 352)) {\n        state.k = 8;\n        invalidate_route_result(state);\n        state.message = "已选择经济优先策略";\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        left + 105, 380,\n        left + 125, 400)) {\n        state.allow_bike = !state.allow_bike;\n        invalidate_route_result(state);\n\n        if (state.allow_bike)\n            state.message = "已允许骑行接驳";\n        else\n            state.message = "已关闭骑行接驳";\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        left, 444, left + 158, 486)) {\n        calculate_route_for_ui(\n            vertices, vertex_number, state);\n    }\n    else if (is_point_in_rectangle(\n        mouse_x, mouse_y,\n        right - 158, 444, right, 486)) {\n        reset_ui_state(state);\n    }\n}\n\n/***************************************************************************\n  函数名称：handle_mouse_move\n  功    能：更新新版界面当前悬停站点\n  输入参数：鼠标坐标、顶点数组、嘉定局部节点和ui_state\n  返 回 值：悬停对象变化返回true，否则返回false\n  说    明：只在鼠标进入左侧地图区域时做站点命中判断\n***************************************************************************/\nbool handle_mouse_move(int mouse_x, int mouse_y,\n    const vertex vertices[], int vertex_number,\n    const jiading_map_node map_nodes[],\n    int map_node_number,\n    ui_state& state)\n{\n    int hovered_vertex = -1;\n\n    if (mouse_x < ui_layout::map_width) {\n        if (state.is_jiading_campus)\n            hovered_vertex =\n                find_clicked_jiading_vertex(\n                    map_nodes, map_node_number,\n                    mouse_x, mouse_y);\n        else {\n            hovered_vertex =\n                find_clicked_vertex(\n                    vertices, vertex_number,\n                    mouse_x, mouse_y);\n\n            if (hovered_vertex == -2)\n                hovered_vertex = -1;\n        }\n    }\n\n    if (hovered_vertex == state.hovered_vertex)\n        return false;\n\n    state.hovered_vertex = hovered_vertex;\n    return true;\n}\n\n/***************************************************************************\n  函数名称：run_easyx_interface\n  功    能：运行新版EasyX主界面消息循环\n  输入参数：顶点、线路、嘉定局部节点、背景图和ui_state\n  返 回 值：无\n  说    明：整个课设演示始终在同一个1500x800窗口中完成，不需要切换应用或重新布局窗口\n***************************************************************************/\nvoid run_easyx_interface(\n    vertex vertices[],\n    int vertex_number,\n    const transit_line lines[],\n    int line_number,\n    const jiading_map_node map_nodes[],\n    int map_node_number,\n    const IMAGE& jiading_background,\n    ui_state& state)\n{\n    BeginBatchDraw();\n\n    draw_easyx_interface(\n        vertices, vertex_number,\n        lines, line_number,\n        map_nodes, map_node_number,\n        jiading_background, state);\n\n    while (true) {\n        ExMessage message =\n            getmessage(EX_MOUSE | EX_KEY | EX_WINDOW);\n\n        if (message.message == WM_CLOSE)\n            break;\n\n        if (message.message == WM_KEYDOWN\n            && message.vkcode == VK_ESCAPE)\n            break;\n\n        if (message.message == WM_MOUSEMOVE) {\n            if (handle_mouse_move(\n                message.x, message.y,\n                vertices, vertex_number,\n                map_nodes, map_node_number,\n                state)) {\n                draw_easyx_interface(\n                    vertices, vertex_number,\n                    lines, line_number,\n                    map_nodes, map_node_number,\n                    jiading_background, state);\n            }\n            continue;\n        }\n\n        if (message.message == WM_LBUTTONDOWN) {\n            handle_left_click(\n                message.x, message.y,\n                vertices, vertex_number,\n                map_nodes, map_node_number,\n                state);\n\n            draw_easyx_interface(\n                vertices, vertex_number,\n                lines, line_number,\n                map_nodes, map_node_number,\n                jiading_background, state);\n        }\n    }\n\n    EndBatchDraw();\n}\n\n/***************************************************************************\n  函数名称：main\n  功    能：程序入口，加载数据并启动EasyX界面\n  输入参数：无\n  返 回 值：0表示正常结束，非0表示数据加载失败\n  说    明：高DPI设置必须早于EasyX窗口创建\n***************************************************************************/\n' + "\n" + text[main_position:]

