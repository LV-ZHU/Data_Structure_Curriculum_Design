name: layout-fix-822-v2

on:
  push:
    branches:
      - layout-fix-822-20260905
    paths:
      - .github/workflows/layout-fix-822-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout-fix-822-20260905
          fetch-depth: 0

      - name: 继续修正嘉定公交布局
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.cpp')
          text = path.read_bytes().decode('gb2312')
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          marker_start = '    // 822路按“封浜公交站 -> 嘉定校区正门”方向排布；其余公交节点恢复CSV原始坐标\n'
          marker_end = '    screen_point point;\n'
          start = text.index(marker_start)
          end = text.index(marker_end, start)
          new_coordinates = '''    // 822路沿“封浜公交站 -> 嘉定校区正门”直线方向排布，封浜公交站紧贴封浜地铁站\n    switch (physical_vertex) {\n        case 74: logical_x = 325; logical_y = 355; break; // 封浜公交站\n        case 75: logical_x = 310; logical_y = 345; break; // 翔江路\n        case 76: logical_x = 294; logical_y = 336; break; // 曹丰路\n        case 77: logical_x = 279; logical_y = 326; break; // 宝园五路\n        case 78: logical_x = 263; logical_y = 317; break; // 宝园七路\n        case 79: logical_x = 248; logical_y = 307; break; // 联西路\n        case 80: logical_x = 232; logical_y = 298; break; // 联群路\n        case 81: logical_x = 217; logical_y = 288; break; // 星塔路\n        case 82: logical_x = 201; logical_y = 279; break; // 许家东街村\n        case 83: logical_x = 186; logical_y = 269; break; // 新黄公路\n        case 84: logical_x = 170; logical_y = 260; break; // 嘉松北路\n        default: break;\n    }\n\n'''
          text = text[:start] + new_coordinates + text[end:]

          old_name_rule = '    if (name == "公交昌吉东路站")\n        return "昌吉东路站";\n'
          new_name_rule = '    if (name == "公交昌吉东路站")\n        return "昌吉东路站";\n    if (name == "于塘南路望融路")\n        return "望融路";\n'
          if 'if (name == "于塘南路望融路")' not in text:
              text = text.replace(old_name_rule, new_name_rule, 1)

          fn_start = text.index('bool get_manual_station_label_rectangle(int vertex_id,')
          switch_start = text.index('    switch (vertex_id) {', fn_start)
          switch_end = text.index('    rectangle.left = point.x + dx;', switch_start)
          new_switch = '''    switch (vertex_id) {\n        case 28: dx = -42;  dy = -34; break; // 上海赛车场\n        case 27: dx = -42;  dy = -34; break; // 嘉定新城\n        case 26: dx = 14;   dy = -24; break; // 马陆\n        case 25: dx = 14;   dy = -24; break; // 陈翔公路\n        case 24: dx = 14;   dy = -24; break; // 南翔\n        case 29: dx = -120; dy = -42; break; // 昌吉东路\n        case 30: dx = -78;  dy = 24;  break; // 上海汽车城\n\n        case 64: dx = 22;   dy = -38; break; // 昌吉东路站\n        case 65: dx = -100; dy = -26; break; // 双浦路\n        case 66: dx = -40;  dy = 28;  break; // 于塘南路\n        case 67: dx = -40;  dy = 22;  break; // 望融路\n        case 68: dx = -100; dy = 20;  break; // 安虹北路\n        case 69: dx = 20;   dy = 20;  break; // 绿苑路\n        case 70: dx = 18;   dy = 12;  break; // 安谐路\n        case 71: dx = -80;  dy = 14;  break; // 于田路\n        case 72: dx = 20;   dy = -34; break; // 安虹路\n        case 73: dx = -100; dy = 20;  break; // 二十三号桥\n\n        case 47: dx = -62;  dy = -36; break; // 封浜地铁\n        case 74: dx = 18;   dy = 12;  break; // 封浜公交站\n        case 75: dx = 18;   dy = -32; break; // 翔江路\n        case 76: dx = -70;  dy = 14;  break; // 曹丰路\n        case 77: dx = 18;   dy = -32; break; // 宝园五路\n        case 78: dx = -78;  dy = 14;  break; // 宝园七路\n        case 79: dx = 18;   dy = -32; break; // 联西路\n        case 80: dx = -70;  dy = 14;  break; // 联群路\n        case 81: dx = 18;   dy = -32; break; // 星塔路\n        case 82: dx = -86;  dy = 14;  break; // 许家东街村\n        case 83: dx = 18;   dy = -32; break; // 新黄公路\n        case 84: dx = -78;  dy = 14;  break; // 嘉松北路\n        default: return false;\n    }\n\n'''
          text = text[:switch_start] + new_switch + text[switch_end:]

          if 'case 74: logical_x = 325; logical_y = 355;' not in text:
              raise SystemExit('封浜公交站Y坐标未上移20')
          if 'case 84: logical_x = 170; logical_y = 260;' not in text:
              raise SystemExit('822末端坐标未写入')
          if 'return "望融路";' not in text:
              raise SystemExit('望融路简称未写入')
          if text.count('{') != text.count('}'):
              raise SystemExit('花括号数量不平衡')

          path.write_bytes(text.replace('\n', '\r\n').encode('gb2312'))
          check = path.read_bytes()
          check.decode('gb2312')
          if b'\n' in check.replace(b'\r\n', b''):
              raise SystemExit('存在非CRLF换行')
          print('嘉定公交二次布局修正完成，GB2312 + CRLF检查通过')

      - name: 提交修改
        run: |
          rm .github/workflows/layout-fix-822-v2.yml
          git config user.name "LV-ZHU"
          git config user.email "212522225+LV-ZHU@users.noreply.github.com"
          git add -A
          git commit -m "继续修正嘉定公交布局"
          git push origin HEAD:layout-fix-822-20260905
